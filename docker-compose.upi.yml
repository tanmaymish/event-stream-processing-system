version: '3.8'

# India UPI Real-Time Payment Streaming System — Full Stack
#
# Quick start:
#   docker-compose -f docker-compose.upi.yml up -d
#
# API endpoints after startup (~60s):
#   Gateway metrics:   http://localhost:8090/upi/metrics
#   Merchant top 10:   http://localhost:8091/merchant/top
#   Bank settlement:   http://localhost:8092/settlement/all
#   Regional stats:    http://localhost:8093/regional/top/states

x-upi-service: &upi-base
  image: ghcr.io/tanmaymish/event-stream-processing-system:latest
  restart: unless-stopped
  depends_on:
    kafka-init:
      condition: service_completed_successfully

services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: upi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: upi-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: upi-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: upi-kafka-init
    depends_on:
      schema-registry:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cub kafka-ready -b kafka:29092 1 60 && \
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic upi-transactions      --partitions 6 --replication-factor 1 && \
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic upi-transactions-p2p  --partitions 4 --replication-factor 1 && \
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic upi-transactions-p2m  --partitions 4 --replication-factor 1 && \
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic upi-fraud-alerts      --partitions 2 --replication-factor 1 && \
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic orders               --partitions 2 --replication-factor 1 && \
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic payments             --partitions 2 --replication-factor 1 && \
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic events              --partitions 2 --replication-factor 1 && \
        echo "All UPI topics ready." && kafka-topics --bootstrap-server kafka:29092 --list

  # ── UPI Services ──────────────────────────────────────────────────────────────

  upi-gateway:
    <<: *upi-base
    container_name: upi-gateway
    ports:
      - "8090:8090"
    entrypoint:
      - java
      - -Xms256m
      - -Xmx512m
      - -cp
      - /app/upi-streaming.jar
      - io.confluent.examples.streams.microservices.UpiTransactionService
      - kafka:29092
      - http://schema-registry:8081
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/upi/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  upi-fraud:
    <<: *upi-base
    container_name: upi-fraud
    depends_on:
      upi-gateway:
        condition: service_healthy
    entrypoint:
      - java
      - -Xms256m
      - -Xmx512m
      - -cp
      - /app/upi-streaming.jar
      - io.confluent.examples.streams.microservices.UpiVelocityFraudService
      - kafka:29092
    volumes:
      - upi-fraud-state:/tmp/kafka-streams

  upi-merchant:
    <<: *upi-base
    container_name: upi-merchant
    depends_on:
      upi-gateway:
        condition: service_healthy
    ports:
      - "8091:8091"
    entrypoint:
      - java
      - -Xms256m
      - -Xmx512m
      - -cp
      - /app/upi-streaming.jar
      - io.confluent.examples.streams.microservices.MerchantAnalyticsService
      - kafka:29092
      - "8091"
    volumes:
      - upi-merchant-state:/tmp/kafka-streams

  upi-settlement:
    <<: *upi-base
    container_name: upi-settlement
    depends_on:
      upi-gateway:
        condition: service_healthy
    ports:
      - "8092:8092"
    entrypoint:
      - java
      - -Xms256m
      - -Xmx512m
      - -cp
      - /app/upi-streaming.jar
      - io.confluent.examples.streams.microservices.BankSettlementService
      - kafka:29092
      - "8092"
    volumes:
      - upi-settlement-state:/tmp/kafka-streams

  upi-regional:
    <<: *upi-base
    container_name: upi-regional
    depends_on:
      upi-gateway:
        condition: service_healthy
    ports:
      - "8093:8093"
    entrypoint:
      - java
      - -Xms256m
      - -Xmx512m
      - -cp
      - /app/upi-streaming.jar
      - io.confluent.examples.streams.microservices.RegionalAnalyticsService
      - kafka:29092
      - "8093"
    volumes:
      - upi-regional-state:/tmp/kafka-streams

  # ── Simulator: generates 50 realistic India UPI txns/sec ─────────────────────

  upi-simulator:
    <<: *upi-base
    container_name: upi-simulator
    depends_on:
      upi-gateway:
        condition: service_healthy
    entrypoint:
      - java
      - -Xms128m
      - -Xmx256m
      - -cp
      - /app/upi-streaming.jar
      - io.confluent.examples.streams.microservices.util.ProduceUpiTransactions
      - kafka:29092
      - "50"
      - "86400"

volumes:
  upi-fraud-state:
  upi-merchant-state:
  upi-settlement-state:
  upi-regional-state:
