name: Build & Deploy UPI Streaming System

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      jar-name: ${{ steps.jar.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build fat jar
        run: mvn clean package -DskipTests -q

      - name: Get jar name
        id: jar
        run: echo "name=$(ls target/kafka-streams-examples-*-standalone.jar)" >> $GITHUB_OUTPUT

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: upi-streaming-jar
          path: target/kafka-streams-examples-*-standalone.jar
          retention-days: 7

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: upi-streaming-jar
          path: target/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## UPI Streaming System Deployed

          **Image:** `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

          ### Run the full stack
          ```bash
          docker-compose -f docker-compose.upi.yml up -d
          ```

          ### API Endpoints (ready in ~60s)
          | Service | URL |
          |---------|-----|
          | Gateway metrics | http://localhost:8090/upi/metrics |
          | Merchant top 10 | http://localhost:8091/merchant/top |
          | Bank settlement | http://localhost:8092/settlement/all |
          | Regional stats  | http://localhost:8093/regional/top/states |

          ### Send a test transaction
          ```bash
          curl -X POST http://localhost:8090/upi/transaction \
            -H 'Content-Type: application/json' \
            -d '{"txnId":"T001","senderVpa":"rahul@oksbi","receiverVpa":"swiggy_ind@okaxis",
                 "amountInr":349,"status":"SUCCESS","category":"Food & Dining",
                 "merchantId":"swiggy_ind","merchantName":"Swiggy",
                 "senderCity":"Bangalore","senderState":"Karnataka",
                 "senderBank":"SBI","receiverBank":"Axis",
                 "deviceType":"ANDROID","upiApp":"PHONEPE","timestamp":1719500000000}'
          ```
          EOF
