name: Build & Deploy UPI Streaming System

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  test:
    name: UPI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The image build runs with -Dmaven.test.skip=true, so this job is the only place the
      # UPI tests actually execute. The upi-tests profile narrows test compilation to the UPI
      # sources: the inherited Confluent test sources do not compile against the Kafka version
      # this build resolves. See the profile comment in pom.xml.
      - name: Run the UPI test suite
        run: >
          mvn -B test -s .mvn/settings.xml -Pupi-tests
          -Dcheckstyle.skip=true
          -Dtest='Upi*Test'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Publish test report
        if: always()
        run: |
          echo "## UPI test results" >> $GITHUB_STEP_SUMMARY
          for f in target/surefire-reports/*.txt; do
            [ -e "$f" ] || continue
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -5 "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        if: github.event_name != 'pull_request'
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## UPI Streaming System Deployed

          **Image:** `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

          ### Run the full stack
          ```bash
          docker-compose -f docker-compose.upi.yml up -d
          ```

          ### API Endpoints (ready in ~60s)
          | Service | URL |
          |---------|-----|
          | Gateway metrics | http://localhost:8090/upi/metrics |
          | Merchant top 10 | http://localhost:8091/merchant/top |
          | Bank settlement | http://localhost:8092/settlement/all |
          | Regional stats  | http://localhost:8093/regional/top/states |

          ### Send a test transaction
          ```bash
          curl -X POST http://localhost:8090/upi/transaction \
            -H 'Content-Type: application/json' \
            -d '{"txnId":"T001","senderVpa":"rahul@oksbi","receiverVpa":"swiggy_ind@okaxis",
                 "amountInr":349,"status":"SUCCESS","category":"Food & Dining",
                 "merchantId":"swiggy_ind","merchantName":"Swiggy",
                 "senderCity":"Bangalore","senderState":"Karnataka",
                 "senderBank":"SBI","receiverBank":"Axis",
                 "deviceType":"ANDROID","upiApp":"PHONEPE","timestamp":1719500000000}'
          ```
          EOF
